<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH - Test Submitted</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0f172a;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
        .bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
        .glow-1{background:#6366f1;top:-150px;left:-150px}
        .glow-2{background:#14b8a6;bottom:-150px;right:-150px}
        .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:56px 44px;max-width:420px;width:90%;backdrop-filter:blur(20px);position:relative;z-index:1;text-align:center}
        .icon{width:80px;height:80px;background:rgba(99,102,241,.15);border:2px solid rgba(99,102,241,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
        h2{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:10px}
        p{color:#64748b;font-size:.9rem;line-height:1.6;margin-bottom:32px}
        .home-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border-radius:12px;text-decoration:none;font-size:.9rem;font-weight:600;transition:opacity .2s}
        .home-btn:hover{opacity:.9}
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="card">
        <div class="icon">🎉</div>
        <h2>Test Submitted!</h2>
        <p>Your answers have been submitted successfully. Your teacher will review and share results soon.</p>
        <a href="/" class="home-btn"><i class="fas fa-home"></i> Back to Home</a>
    </div>
</body>
</html>
