<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH - Exam Created</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0f172a;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
        .bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
        .glow-1{background:#14b8a6;top:-150px;right:-150px}
        .glow-2{background:#6366f1;bottom:-150px;left:-150px}
        .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:52px 44px;max-width:440px;width:90%;backdrop-filter:blur(20px);position:relative;z-index:1;text-align:center}
        .success-icon{width:72px;height:72px;background:rgba(20,184,166,.15);border:2px solid rgba(20,184,166,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px}
        h1{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:8px}
        .sub{color:#64748b;font-size:.88rem;margin-bottom:32px}
        .code-box{background:#1e293b;border:1px solid rgba(20,184,166,.3);border-radius:14px;padding:20px 24px;margin-bottom:24px}
        .code-label{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:10px}
        .code-value{font-size:1.8rem;font-weight:700;color:#5eead4;letter-spacing:4px;font-family:monospace}
        .copy-btn{width:100%;padding:12px;background:rgba(20,184,166,.15);border:1px solid rgba(20,184,166,.3);color:#5eead4;border-radius:11px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
        .copy-btn:hover{background:rgba(20,184,166,.25)}
        .nav-btn{width:100%;padding:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border:none;border-radius:11px;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
        .nav-btn:hover{opacity:.9}
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="card">
        <div class="success-icon">✅</div>
        <h1>Exam Created!</h1>
        <p class="sub">Share the test code below with your students</p>
        <div class="code-box">
            <div class="code-label">Test Code</div>
            <div class="code-value" id="testCode">{{ test_code }}</div>
        </div>
        <button class="copy-btn" onclick="copyCode()"><i class="fas fa-copy"></i> Copy Code</button>
        <a href="/teacher" class="nav-btn"><i class="fas fa-home"></i> Back to Dashboard</a>
    </div>
    <script>
        function copyCode(){
            navigator.clipboard.writeText(document.getElementById('testCode').textContent)
                .then(()=>alert('Test code copied!'));
        }
    </script>
</body>
</html>
