<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - DASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 260px; background: #1e293b;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-direction: column;
            padding: 28px 16px; position: fixed; height: 100vh;
        }
        .sidebar-logo {
            display: flex; align-items: center; gap: 12px;
            padding: 0 8px 28px;
            border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 20px;
        }
        .sidebar-logo .icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #6366f1, #14b8a6);
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .sidebar-logo span { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
        .sidebar-logo small { display: block; font-size: 0.72rem; color: #64748b; }
        .nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #475569; padding: 0 12px; margin-bottom: 8px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 14px; border-radius: 10px;
            color: #94a3b8; text-decoration: none;
            font-size: 0.9rem; font-weight: 500; transition: all 0.2s; margin-bottom: 4px;
        }
        .nav-link i { width: 18px; text-align: center; font-size: 0.9rem; }
        .nav-link:hover, .nav-link.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
        .nav-link.active { border-left: 3px solid #6366f1; }
        .sidebar-bottom { margin-top: auto; }

        .main { margin-left: 260px; flex: 1; padding: 36px; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; }
        .page-header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }

        .form-card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 32px;
            max-width: 760px;
        }
        .form-section-title {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            color: #475569; margin-bottom: 16px; margin-top: 28px;
        }
        .form-section-title:first-child { margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 0.82rem; font-weight: 500; color: #94a3b8; }
        .input-wrap {
            display: flex; align-items: center; gap: 10px;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 0 14px;
        }
        .input-wrap i { color: #475569; font-size: 0.85rem; }
        .input-wrap input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #e2e8f0; font-size: 0.9rem; padding: 12px 0;
            font-family: 'Inter', sans-serif;
        }
        .input-wrap input::placeholder { color: #475569; }
        .input-wrap:focus-within { border-color: #6366f1; }
        .picker-wrap { cursor: pointer; }
        .input-wrap input[type="date"],
        .input-wrap input[type="time"] {
            color-scheme: dark;
        }
        .input-wrap input[type="date"]::-webkit-calendar-picker-indicator,
        .input-wrap input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.6);
            cursor: pointer;
            opacity: 0.7;
        }

        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 24px 0; }

        .question-row {
            display: flex; gap: 12px; align-items: center;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 12px 16px; margin-bottom: 10px;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .question-row input {
            background: transparent; border: none; outline: none;
            color: #e2e8f0; font-size: 0.9rem; font-family: 'Inter', sans-serif;
        }
        .question-row input:first-child { flex: 1; }
        .question-row input:last-of-type { width: 80px; text-align: center; border-left: 1px solid rgba(255,255,255,0.08); padding-left: 12px; }
        .question-row input::placeholder { color: #475569; }
        .remove-btn { background: none; border: none; color: #475569; cursor: pointer; padding: 4px; font-size: 0.9rem; transition: color 0.2s; }
        .remove-btn:hover { color: #f87171; }

        .add-btn {
            display: flex; align-items: center; gap: 8px;
            background: rgba(99,102,241,0.1); border: 1px dashed rgba(99,102,241,0.3);
            border-radius: 10px; padding: 12px 16px;
            color: #a5b4fc; font-size: 0.88rem; font-weight: 500;
            cursor: pointer; width: 100%; transition: all 0.2s; margin-top: 4px;
        }
        .add-btn:hover { background: rgba(99,102,241,0.18); }

        .submit-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            margin-top: 28px; transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="icon">🎓</div>
            <div><span>DASH</span><small>Teacher Panel</small></div>
        </div>
        <div class="nav-label">Menu</div>
        <a href="/teacher" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/teacher/create_exam" class="nav-link active"><i class="fas fa-plus-circle"></i> Create Exam</a>
        <a href="/teacher/paper_checking" class="nav-link"><i class="fas fa-file-alt"></i> Paper Checking</a>
        <a href="/teacher/results_summary" class="nav-link"><i class="fas fa-chart-bar"></i> Results</a>
        <div class="sidebar-bottom">
            <a href="/" class="nav-link"><i class="fas fa-sign-out-alt"></i> Back to Home</a>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <h1>Create Exam</h1>
            <p>Fill in the exam details and add questions below.</p>
        </div>

        <div class="form-card">
            <form action="/teacher/submit_test" method="post">
                <div class="form-section-title">Exam Information</div>
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Exam Name</label>
                        <div class="input-wrap"><i class="fas fa-graduation-cap"></i><input type="text" name="name" placeholder="e.g. Mid-Term Mathematics" required></div>
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <div class="input-wrap picker-wrap" onclick="this.querySelector('input').showPicker()">
                            <i class="fas fa-clock" style="cursor:pointer"></i>
                            <input type="time" name="time" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <div class="input-wrap picker-wrap" onclick="this.querySelector('input').showPicker()">
                            <i class="fas fa-calendar" style="cursor:pointer"></i>
                            <input type="date" name="date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Duration</label>
                        <div class="input-wrap"><i class="fas fa-hourglass-half"></i><input type="text" name="duration" placeholder="e.g. 2 hours" required></div>
                    </div>
                    <div class="form-group">
                        <label>Total Marks</label>
                        <div class="input-wrap"><i class="fas fa-star"></i><input type="number" name="total_marks" placeholder="e.g. 100" required></div>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <div class="input-wrap"><i class="fas fa-book"></i><input type="text" name="subject" placeholder="e.g. Mathematics" required></div>
                    </div>
                    <div class="form-group">
                        <label>Faculty Name</label>
                        <div class="input-wrap"><i class="fas fa-user-tie"></i><input type="text" name="faculty" placeholder="e.g. Dr. Sharma" required></div>
                    </div>
                </div>

                <hr class="divider">
                <div class="form-section-title">Questions</div>

                <div id="questions-container">
                    <div class="question-row">
                        <input type="text" name="questions" placeholder="Enter question..." required>
                        <input type="number" name="marks" placeholder="Marks" required>
                        <button type="button" class="remove-btn" onclick="removeQuestion(this)"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <button type="button" class="add-btn" onclick="addQuestion()">
                    <i class="fas fa-plus"></i> Add Another Question
                </button>

                <button type="submit" class="submit-btn">Create Exam</button>
            </form>
        </div>
    </main>

    <script>
        // Auto-fill current date and time
        const now = new Date();
        const timeStr = now.toTimeString().slice(0, 5); // HH:MM
        const dateStr = now.toISOString().slice(0, 10);  // YYYY-MM-DD
        document.querySelector('input[name="time"]').value = timeStr;
        document.querySelector('input[name="date"]').value = dateStr;

        function addQuestion() {
            const container = document.getElementById('questions-container');
            const row = document.createElement('div');
            row.className = 'question-row';
            row.innerHTML = `
                <input type="text" name="questions" placeholder="Enter question..." required>
                <input type="number" name="marks" placeholder="Marks" required>
                <button type="button" class="remove-btn" onclick="removeQuestion(this)"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        }
        function removeQuestion(btn) {
            const rows = document.querySelectorAll('.question-row');
            if (rows.length > 1) btn.closest('.question-row').remove();
        }
    </script>
</body>
</html>
